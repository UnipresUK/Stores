<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stores Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-heading">
    <h1>Stores Management</h1>
    <button id="settingsBtn" type="button" class="settings-btn" aria-label="Settings">&#9881;</button>
  </div>

  <div class="field">
    <label for="requester">Your name</label>
    <input id="requester" list="requesterList" placeholder="Select or type your name" autocomplete="off">
    <datalist id="requesterList">
      <option value="Sam Pascoe">
      <option value="Rob Reay">
      <option value="Jordan Howe">
      <option value="Megan Gorman">
      <option value="Ian Jukes">
      <option value="Daniel Hall">
      <option value="Dave Rudd">
      <option value="Gary Trueman">
      <option value="Tim Belsey">
      <option value="Waki-san">
    </datalist>
  </div>

  <p id="gateHint" class="gate-hint">Enter your name above to view the stock list.</p>
  <button id="gateContinueBtn" type="button" class="continue-btn hidden">Continue</button>

  <div id="searchControls" class="search-controls hidden">
    <div class="field">
      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Search by SKU, description, or location (e.g. A1)" autocomplete="off">
    </div>

    <div id="categoryChips" class="category-chips"></div>

    <label class="checkbox-field">
      <input id="lowStockOnly" type="checkbox">
      Low stock only
    </label>
  </div>
</header>

<main id="mainContent" class="hidden">
  <div id="removalsPanel" class="removals-panel hidden">
    <h2>Recent removals</h2>
    <div id="removalsList" class="removals-list"></div>
  </div>
  <p id="status" class="status"></p>
  <div id="productGrid" class="product-grid"></div>
</main>

<div id="cartBar" class="cart-bar hidden">
  <span id="cartCount"></span>
  <button id="cartSubmitBtn" type="button">Submit Order</button>
</div>

<div id="confirmOverlay" class="overlay hidden">
  <div class="confirm-card">
    <h2>Confirm order</h2>
    <p>Requester: <strong id="confirmRequester"></strong></p>
    <ul id="confirmList" class="confirm-list"></ul>
    <div class="confirm-actions">
      <button id="confirmCancelBtn" type="button" class="secondary">Cancel</button>
      <button id="confirmSubmitBtn" type="button">Confirm &amp; Send</button>
    </div>
  </div>
</div>

<div id="settingsOverlay" class="overlay hidden">
  <div class="confirm-card">
    <h2>Settings</h2>
    <label class="checkbox-field">
      <input id="showRemovalsToggle" type="checkbox">
      Show recent stock removals
    </label>
    <p class="gate-hint">See every Take Stock action as it happens, so you can keep an eye on things while this is new.</p>
    <div class="confirm-actions">
      <button id="settingsCloseBtn" type="button">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
