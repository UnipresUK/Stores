<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unipres Stores</title>
<style>
:root {
  --bg:     #f4f6f9;
  --card:   #ffffff;
  --card2:  #f0f2f6;
  --border: #dde1ea;
  --text:   #1a2035;
  --muted:  #8a93a8;
  --dim:    #4a5368;
  --accent: #4f7ef8;
  --green:  #16a34a;
  --amber:  #d97706;
  --red:    #dc2626;
  --r:      10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.header-top {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
}
.brand {
  font-size: 12px; font-weight: 700; letter-spacing: 1px;
  color: var(--accent); white-space: nowrap; flex-shrink: 0;
}
.search-wrap { flex: 1; position: relative; }
.search-input {
  width: 100%; background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: inherit;
  font-size: 14px; padding: 8px 12px 8px 34px; outline: none; transition: border .15s;
}
.search-input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 14px; pointer-events: none;
}
.icon-btn {
  background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--dim); font-size: 18px; cursor: pointer; padding: 6px 10px;
  transition: all .15s; line-height: 1; flex-shrink: 0;
}
.icon-btn:hover { color: var(--text); border-color: var(--dim); }
.icon-btn.active { color: var(--accent); border-color: var(--accent); }

/* ── Chip bar ── */
.chip-bar {
  display: flex; gap: 7px; padding: 8px 16px 10px;
  overflow-x: auto; scrollbar-width: none;
}
.chip-bar::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 5px 14px; border-radius: 20px; font-size: 12px;
  font-weight: 500; cursor: pointer; border: 1px solid var(--border);
  background: var(--card2); color: var(--dim); transition: all .15s; white-space: nowrap;
}
.chip:hover { border-color: var(--dim); color: var(--text); }
.chip.active { background: var(--accent); border-color: var(--accent); color: white; }

/* ── Main / grid ── */
.main { padding: 14px 16px 100px; max-width: 1400px; margin: 0 auto; }
.grid-info {
  font-size: 12px; color: var(--muted); margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}

.product-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
}
.product-grid.compact {
  gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
}
@media (max-width: 520px) {
  .product-grid, .product-grid.compact {
    grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
}

/* ── Product card ── */
.product-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden; display: flex;
  flex-direction: column; transition: border-color .15s, transform .12s;
}
.product-card:hover { border-color: #b0b8cc; transform: translateY(-2px); }
.product-card.oos { opacity: .6; }

.card-img-wrap {
  width: 100%; aspect-ratio: 4/3; background: #f0f2f6;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.card-img { width: 100%; height: 100%; object-fit: contain; padding: 8px; display: block; }
.card-img-placeholder { font-size: 44px; color: var(--muted); }
.product-grid.compact .card-img-placeholder { font-size: 32px; }

.card-body { padding: 10px 12px 6px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
.product-grid.compact .card-body { padding: 8px 10px 4px; gap: 4px; }

.card-name {
  font-size: 13px; font-weight: 600; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.product-grid.compact .card-name { font-size: 12px; }

.card-sku { font-size: 11px; color: var(--muted); font-family: monospace; }
.product-grid.compact .card-sku { display: none; }

.stock-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stock-badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
}
.s-ok  { background: #dcfce7; color: var(--green); }
.s-low { background: #fef3c7; color: var(--amber); }
.s-out { background: #fee2e2; color: var(--red); }
.unit  { font-size: 11px; color: var(--muted); }

.qty-row {
  display: flex; align-items: center; gap: 6px;
  margin-top: auto; padding-top: 8px;
}
.product-grid.compact .qty-row { padding-top: 5px; }
.qty-btn {
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card2); color: var(--text); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s; flex-shrink: 0;
}
.qty-btn:hover { background: var(--border); }
.product-grid.compact .qty-btn { width: 24px; height: 24px; font-size: 14px; }
.qty-num {
  width: 30px; text-align: center; font-size: 14px;
  font-weight: 600; font-family: monospace;
}
.product-grid.compact .qty-num { font-size: 13px; width: 26px; }

.card-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  padding: 6px 12px 12px;
}
.product-grid.compact .card-actions { padding: 4px 10px 10px; gap: 4px; }
.card-btn {
  padding: 8px 4px; border-radius: 6px; border: none; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all .15s;
}
.product-grid.compact .card-btn { padding: 6px 4px; font-size: 11px; }
.btn-take {
  background: #dcfce7; color: var(--green); border: 1px solid #bbf7d0;
}
.btn-take:hover { background: #bbf7d0; }
.btn-take:disabled { opacity: .35; cursor: not-allowed; }
.btn-req { background: var(--accent); color: white; }
.btn-req:hover { background: #3d6ee0; }

/* ── Basket FAB ── */
.basket-fab {
  position: fixed; bottom: 22px; right: 22px; z-index: 100;
  background: var(--accent); color: white; border: none; border-radius: 50px;
  padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
  box-shadow: 0 8px 28px rgba(79,126,248,.45);
  display: flex; align-items: center; gap: 8px;
  transition: transform .15s, box-shadow .15s, opacity .15s;
}
.basket-fab:hover { transform: scale(1.04); box-shadow: 0 12px 36px rgba(79,126,248,.55); }
.basket-fab.hide { opacity: 0; pointer-events: none; transform: scale(.9); }
.fab-badge {
  background: white; color: var(--accent); border-radius: 50%;
  width: 22px; height: 22px; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* ── Basket panel ── */
.overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 150;
}
.overlay.open { display: block; }

.basket-panel {
  position: fixed; top: 0; right: -440px; width: min(440px, 100%); height: 100%;
  background: var(--card); border-left: 1px solid var(--border);
  z-index: 200; display: flex; flex-direction: column;
  transition: right .28s cubic-bezier(.4,0,.2,1);
}
.basket-panel.open { right: 0; }
@media (max-width: 520px) {
  .basket-panel {
    top: auto; right: 0; bottom: -100%; width: 100%; height: 88vh;
    border-left: none; border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    transition: bottom .28s cubic-bezier(.4,0,.2,1);
  }
  .basket-panel.open { bottom: 0; }
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--card); z-index: 1;
}
.panel-head h3 { font-size: 16px; font-weight: 700; }
.panel-close {
  background: none; border: none; color: var(--muted); font-size: 22px;
  cursor: pointer; padding: 2px 8px; border-radius: 5px; line-height: 1;
}
.panel-close:hover { color: var(--text); background: var(--card2); }

.basket-scroll { flex: 1; overflow-y: auto; padding: 10px 20px; }
.basket-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.bi-img {
  width: 56px; height: 56px; object-fit: contain; border-radius: 7px;
  background: var(--card2); padding: 4px; flex-shrink: 0;
}
.bi-img-ph {
  width: 56px; height: 56px; border-radius: 7px; background: var(--card2);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.bi-info { flex: 1; min-width: 0; }
.bi-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bi-sku  { font-size: 11px; color: var(--muted); font-family: monospace; margin-top: 2px; }
.bi-qty  { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.bi-remove {
  background: none; border: none; color: var(--muted); font-size: 20px;
  cursor: pointer; padding: 4px 6px; line-height: 1; border-radius: 4px; flex-shrink: 0;
}
.bi-remove:hover { color: var(--red); background: #fee2e2; }

.basket-empty {
  text-align: center; padding: 52px 20px; color: var(--muted);
}
.basket-empty .icon { font-size: 52px; margin-bottom: 14px; }

.panel-foot {
  padding: 16px 20px; border-top: 1px solid var(--border); background: var(--card);
}
.foot-field { margin-bottom: 12px; }
.foot-field label {
  display: block; font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px;
}
.foot-field input {
  width: 100%; background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: inherit;
  font-size: 14px; padding: 10px 12px; outline: none; transition: border .15s;
}
.foot-field input:focus { border-color: var(--accent); }
.btn-submit {
  width: 100%; padding: 12px; background: var(--accent); color: white;
  border: none; border-radius: 8px; font-family: inherit; font-size: 15px;
  font-weight: 600; cursor: pointer; transition: background .15s;
}
.btn-submit:hover { background: #3d6ee0; }
.btn-submit:disabled { background: var(--muted); cursor: not-allowed; }

/* ── Take modal ── */
.modal-back {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72);
  z-index: 300; align-items: center; justify-content: center; padding: 20px;
}
.modal-back.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; width: 100%; max-width: 380px; padding: 26px;
}
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.4; }
.m-field { margin-bottom: 13px; }
.m-field label {
  display: block; font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px;
}
.m-field input {
  width: 100%; background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: inherit;
  font-size: 14px; padding: 10px 12px; outline: none; transition: border .15s;
}
.m-field input:focus { border-color: var(--accent); }
.modal-btns { display: flex; gap: 8px; margin-top: 20px; }
.btn-cancel {
  flex: 1; padding: 10px; background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--dim); font-family: inherit; font-size: 14px;
  font-weight: 500; cursor: pointer; transition: all .15s;
}
.btn-cancel:hover { color: var(--text); border-color: var(--dim); }
.btn-confirm {
  flex: 2; padding: 10px; background: var(--green); border: none;
  border-radius: 8px; color: white; font-family: inherit; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: background .15s;
}
.btn-confirm:hover { background: #16a34a; }
.btn-confirm:disabled { background: var(--muted); cursor: not-allowed; }

/* ── Setup banner ── */
.setup-banner {
  margin: 16px; background: #172554; border: 1px solid #1d4ed8;
  border-radius: 12px; padding: 20px 24px;
}
.setup-banner h3 { font-size: 15px; font-weight: 700; color: #93c5fd; margin-bottom: 8px; }
.setup-banner p  { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 10px; }
.setup-banner input {
  width: 100%; background: #1e3a8a; border: 1px solid #3b82f6;
  border-radius: 8px; color: white; font-size: 13px; padding: 9px 12px;
  outline: none; font-family: monospace; margin-bottom: 8px;
}
.setup-banner button {
  padding: 8px 20px; background: #3b82f6; border: none;
  border-radius: 7px; color: white; font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer;
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 82px; left: 50%; z-index: 9999;
  transform: translateX(-50%) translateY(12px);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 18px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: all .2s; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error   { border-color: var(--red);   color: var(--red); }

/* ── Skeleton ── */
.skel {
  background: linear-gradient(90deg, #e8eaf0 25%, #f0f2f6 50%, #e8eaf0 75%);
  background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 5px;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ── Spinner ── */
.spinner {
  display: inline-block; width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.25); border-top-color: white;
  border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="brand">UNIPRES / STORES</div>
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="search" class="search-input" placeholder="Search products…" oninput="renderGrid()">
    </div>
    <button class="icon-btn" id="density-btn" onclick="toggleDensity()" title="Toggle grid size">&#8859;</button>
  </div>
  <div class="chip-bar" id="chip-bar"></div>
</header>

<div class="setup-banner" id="setup-banner" style="display:none">
  <h3>&#9881; Connect to Google Sheet</h3>
  <p>Paste your deployed Google Apps Script URL below. Deploy the <code>Code.gs</code> file as a Web App (Execute as Me, Anyone can access) and paste the <code>/exec</code> URL here.</p>
  <input type="text" id="api-input" placeholder="https://script.google.com/macros/s/…/exec">
  <button onclick="saveUrl()">Connect</button>
</div>

<main class="main">
  <div class="grid-info">
    <span id="grid-count"></span>
  </div>
  <div class="product-grid" id="product-grid"></div>
</main>

<!-- Basket FAB -->
<button class="basket-fab hide" id="basket-fab" onclick="openBasket()">
  &#128722;
  <span class="fab-badge" id="fab-badge">0</span>
</button>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeBasket()"></div>

<!-- Basket panel -->
<div class="basket-panel" id="basket-panel">
  <div class="panel-head">
    <h3>Request List</h3>
    <button class="panel-close" onclick="closeBasket()">&#215;</button>
  </div>
  <div class="basket-scroll" id="basket-scroll"></div>
  <div class="panel-foot" id="panel-foot" style="display:none">
    <div class="foot-field">
      <label>Your Name</label>
      <input type="text" id="req-name" placeholder="Enter your name…">
    </div>
    <button class="btn-submit" id="submit-btn" onclick="submitRequest()">Submit Request</button>
  </div>
</div>

<!-- Take modal -->
<div class="modal-back" id="take-modal">
  <div class="modal">
    <h3>Take Stock</h3>
    <div class="modal-sub" id="take-sub"></div>
    <div class="m-field">
      <label>Quantity</label>
      <input type="number" id="take-qty" min="1" value="1">
    </div>
    <div class="m-field">
      <label>Your Name</label>
      <input type="text" id="take-name" placeholder="Enter your name…">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTake()">Cancel</button>
      <button class="btn-confirm" id="take-confirm" onclick="confirmTake()">Confirm Take</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let API_URL  = localStorage.getItem('stores_api_url') || 'https://script.google.com/macros/s/AKfycbwM7b0nUJIwizdppHMk7FAH56EVZ9tPDP7A5jg3B9GcCOu1GnDsVwL2MXWDaCJqxltXQQ/exec';
let products = [];
let basket   = {};
let activeCategory = '';
let compact  = window.matchMedia('(max-width:520px)').matches;
let takePending = null;

// ── Init ────────────────────────────────────────────────────────────────────
async function init() {
  if (!API_URL) {
    document.getElementById('setup-banner').style.display = 'block';
    renderSkeleton();
    return;
  }
  renderSkeleton();
  await loadProducts();
}

function saveUrl() {
  const v = document.getElementById('api-input').value.trim();
  if (!v) return;
  API_URL = v;
  localStorage.setItem('stores_api_url', v);
  document.getElementById('setup-banner').style.display = 'none';
  loadProducts();
}

// ── Load data ────────────────────────────────────────────────────────────────
async function loadProducts() {
  try {
    const res  = await fetch(API_URL + '?action=products');
    const data = await res.json();
    products = (Array.isArray(data) ? data : []).filter(p => (p.description || '').trim());
    buildChips();
    renderGrid();
  } catch (e) {
    document.getElementById('product-grid').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:48px;margin-bottom:14px">⚠️</div><p>Could not load products. Check your API URL.</p></div>';
    toast('Failed to load products', 'error');
  }
}

// ── Categories ───────────────────────────────────────────────────────────────
function buildChips() {
  const cats = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
  const bar  = document.getElementById('chip-bar');
  bar.innerHTML = ['All', ...cats].map(c => {
    const active = (c === 'All' && !activeCategory) || c === activeCategory;
    return `<button class="chip${active ? ' active' : ''}" onclick="setCategory(${JSON.stringify(c)})">${esc(c)}</button>`;
  }).join('');
}

function setCategory(c) {
  activeCategory = c === 'All' ? '' : c;
  buildChips();
  renderGrid();
}

// ── Grid toggle ──────────────────────────────────────────────────────────────
function toggleDensity() {
  compact = !compact;
  document.getElementById('product-grid').classList.toggle('compact', compact);
  document.getElementById('density-btn').classList.toggle('active', compact);
}

// ── Render grid ──────────────────────────────────────────────────────────────
function renderGrid() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = products.filter(p => {
    if (activeCategory && p.category !== activeCategory) return false;
    if (q && !`${p.description} ${p.sku} ${p.category} ${p.oem} ${p.partNumber}`.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('grid-count').textContent =
    filtered.length + ' product' + (filtered.length !== 1 ? 's' : '');

  const grid = document.getElementById('product-grid');
  grid.classList.toggle('compact', compact);

  if (!filtered.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:48px;margin-bottom:14px">📦</div><p>No products found</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(p => cardHtml(p)).join('');
}

function cardHtml(p) {
  const stock = Number(p.currentStock) || 0;
  const min   = Number(p.minLevel)     || 0;
  let badgeCls = 's-ok', badgeTxt = `${stock} in stock`;
  if (stock === 0)              { badgeCls = 's-out'; badgeTxt = 'Out of stock'; }
  else if (min && stock <= min) { badgeCls = 's-low'; badgeTxt = `Low — ${stock} left`; }

  const imgUrl = (p.imageFilename || '').trim();
  const imgHtml = imgUrl
    ? `<img class="card-img" src="${esc(imgUrl)}" alt="" loading="lazy"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const phStyle = imgUrl ? 'style="display:none"' : '';
  const placeholder = `<div class="card-img-placeholder" ${phStyle}>📦</div>`;

  const skuAttr = esc(p.sku);
  const disabled = stock === 0 ? ' disabled' : '';

  return `<div class="product-card${stock === 0 ? ' oos' : ''}">
    <div class="card-img-wrap">
      ${imgHtml}
      ${placeholder}
    </div>
    <div class="card-body">
      <div class="card-name">${esc(p.description)}</div>
      <div class="card-sku">${esc(p.sku)}${p.partNumber ? ' &middot; ' + esc(p.partNumber) : ''}</div>
      <div class="stock-row">
        <span class="stock-badge ${badgeCls}">${badgeTxt}</span>
        ${p.unit ? `<span class="unit">/ ${esc(p.unit)}</span>` : ''}
      </div>
      <div class="qty-row">
        <button class="qty-btn" onclick="cardQty('${skuAttr}',-1)">&#8722;</button>
        <span class="qty-num" id="cq-${skuAttr}">1</span>
        <button class="qty-btn" onclick="cardQty('${skuAttr}',1)">+</button>
      </div>
    </div>
    <div class="card-actions">
      <button class="card-btn btn-take"${disabled} onclick="openTake('${skuAttr}')">Take</button>
      <button class="card-btn btn-req" onclick="addToBasket('${skuAttr}')">+ Request</button>
    </div>
  </div>`;
}

// ── Card qty adjuster ────────────────────────────────────────────────────────
function cardQty(sku, delta) {
  const el = document.getElementById('cq-' + sku);
  if (el) el.textContent = Math.max(1, (parseInt(el.textContent) || 1) + delta);
}
function getCardQty(sku) {
  const el = document.getElementById('cq-' + sku);
  return el ? Math.max(1, parseInt(el.textContent) || 1) : 1;
}

// ── Take stock ───────────────────────────────────────────────────────────────
function openTake(sku) {
  const p = products.find(x => x.sku === sku);
  if (!p) return;
  takePending = p;
  document.getElementById('take-sub').textContent = p.description;
  document.getElementById('take-qty').value  = getCardQty(sku);
  document.getElementById('take-name').value = localStorage.getItem('last_user') || '';
  document.getElementById('take-modal').classList.add('open');
  setTimeout(() => document.getElementById('take-name').focus(), 80);
}

function closeTake() {
  document.getElementById('take-modal').classList.remove('open');
  takePending = null;
}

async function confirmTake() {
  const qty  = parseInt(document.getElementById('take-qty').value, 10);
  const name = document.getElementById('take-name').value.trim();
  if (!qty  || qty  <= 0) { toast('Enter a valid quantity', 'error'); return; }
  if (!name)              { toast('Enter your name',        'error'); return; }
  if (!takePending)       return;

  const product = takePending;
  const btn = document.getElementById('take-confirm');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    const res = await apiFetch('POST', {
      action: 'take', sku: product.sku, qty,
      requester: name, description: product.description
    });
    if (!res.ok) throw new Error(res.error || 'Server error');

    localStorage.setItem('last_user', name);
    const prod = products.find(x => x.sku === res.sku);
    if (prod) prod.currentStock = res.currentStock;

    closeTake();
    toast(`Taken ${qty} × ${product.description}`, 'success');
    renderGrid();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Confirm Take';
  }
}

// ── Basket ───────────────────────────────────────────────────────────────────
function addToBasket(sku) {
  const p   = products.find(x => x.sku === sku);
  if (!p) return;
  const qty = getCardQty(sku);
  if (basket[sku]) basket[sku].qty += qty;
  else             basket[sku] = { product: p, qty };
  updateFAB();
  toast(`Added ${qty} × ${p.description}`, 'success');
}

function removeLine(sku) {
  delete basket[sku];
  updateFAB();
  renderBasket();
}

function lineQty(sku, delta) {
  if (basket[sku]) {
    basket[sku].qty = Math.max(1, basket[sku].qty + delta);
    renderBasket();
  }
}

function updateFAB() {
  const total = Object.values(basket).reduce((s, i) => s + i.qty, 0);
  document.getElementById('fab-badge').textContent = total;
  document.getElementById('basket-fab').classList.toggle('hide', total === 0);
}

function openBasket() {
  renderBasket();
  document.getElementById('basket-panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeBasket() {
  document.getElementById('basket-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function renderBasket() {
  const lines = Object.values(basket);
  const scroll = document.getElementById('basket-scroll');
  const foot   = document.getElementById('panel-foot');

  if (!lines.length) {
    scroll.innerHTML = '<div class="basket-empty"><div class="icon">🛒</div><p>Your request list is empty</p></div>';
    foot.style.display = 'none';
    return;
  }

  foot.style.display = 'block';
  scroll.innerHTML = lines.map(({ product: p, qty }) => {
    const imgUrl = (p.imageFilename || '').trim();
    const imgHtml = imgUrl
      ? `<img class="bi-img" src="${esc(imgUrl)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const ph = `<div class="bi-img-ph" ${imgUrl ? 'style="display:none"' : ''}>📦</div>`;
    const s = esc(p.sku);
    return `<div class="basket-item">
      ${imgHtml}${ph}
      <div class="bi-info">
        <div class="bi-name">${esc(p.description)}</div>
        <div class="bi-sku">${esc(p.sku)}</div>
      </div>
      <div class="bi-qty">
        <button class="qty-btn" style="width:24px;height:24px;font-size:13px" onclick="lineQty('${s}',-1)">&#8722;</button>
        <span class="qty-num" style="width:26px;font-size:13px">${qty}</span>
        <button class="qty-btn" style="width:24px;height:24px;font-size:13px" onclick="lineQty('${s}',1)">+</button>
      </div>
      <button class="bi-remove" onclick="removeLine('${s}')">&#215;</button>
    </div>`;
  }).join('');
}

async function submitRequest() {
  const name  = document.getElementById('req-name').value.trim();
  const lines = Object.values(basket);
  if (!name)         { toast('Enter your name',              'error'); return; }
  if (!lines.length) { toast('Add items to your list first', 'error'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting…';

  try {
    const res = await apiFetch('POST', {
      action: 'reorder',
      requester: name,
      items: lines.map(({ product: p, qty }) => ({ sku: p.sku, qty, description: p.description }))
    });
    if (!res.ok) throw new Error(res.error || 'Server error');

    localStorage.setItem('last_user', name);
    basket = {};
    updateFAB();
    closeBasket();
    toast('Request submitted — email sent ✓', 'success');
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Request';
  }
}

// ── API helper ───────────────────────────────────────────────────────────────
async function apiFetch(method, body) {
  const res = await fetch(API_URL, {
    method,
    redirect: 'follow',
    headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
    body:     JSON.stringify(body)
  });
  return res.json();
}

// ── Skeleton ─────────────────────────────────────────────────────────────────
function renderSkeleton() {
  document.getElementById('product-grid').innerHTML = Array(8).fill(0).map(() => `
    <div class="product-card">
      <div class="skel" style="aspect-ratio:4/3"></div>
      <div class="card-body">
        <div class="skel" style="height:14px;width:75%;margin-bottom:6px"></div>
        <div class="skel" style="height:11px;width:45%;margin-bottom:6px"></div>
        <div class="skel" style="height:20px;width:55%"></div>
      </div>
      <div class="card-actions">
        <div class="skel" style="height:34px;border-radius:6px"></div>
        <div class="skel" style="height:34px;border-radius:6px"></div>
      </div>
    </div>`).join('');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let _toast;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(_toast);
  _toast = setTimeout(() => el.classList.remove('show'), 3200);
}

// ── Close take modal on backdrop click / Enter key ───────────────────────────
document.getElementById('take-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('take-modal')) closeTake();
});
document.getElementById('take-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmTake();
});
document.getElementById('req-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitRequest();
});

init();
</script>
</body>
</html>
